<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Vocabulário em Espanhol</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <h1>Cores</h1>

    <h2>Aprenda as cores em espanhol!</h2>


    <h2
        class="titulo-cor"
        id="vermelho"
    >
        Rojo
    </h2>

    <img
        src="./assets/images/red.png"
        alt="Vermelho"
    >


    <h2
        class="titulo-cor"
        id="azul"
    >
        Azul
    </h2>

    <img
        src="./assets/images/blue.png"
        alt="Azul"
    >


    <h2
        class="titulo-cor"
        id="laranja"
    >
        Anaranjado
    </h2>

    <img
        src="./assets/images/orange.png"
        alt="Laranja"
    >


    <h2
        class="titulo-cor"
        id="verde"
    >
        Verde
    </h2>

    <img
        src="./assets/images/green.png"
        alt="Verde"
    >


    <h2
        class="titulo-cor"
        id="amarelo"
    >
        Amarillo
    </h2>

    <img
        src="./assets/images/yellow.png"
        alt="Amarelo"
    >

</body>

</html>
